[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"


[project]
name = "cryosbi"
authors = [
   { name = "David Silva-Sanchez", email = "david.silva@yale.edu"},
   { name = "Lars Dingeldein"},
   { name = "Pilar Cossio"},
   { name = "Roberto Covino"}
]


version = "0.2"
dependencies = [
    "lampe",
    "zuko",
    "torch",
    "numpy", 
    "matplotlib",
    "scipy",
    "torchvision",
    "mrcfile"
]


[project.scripts]
train_npe_model = "cryo_sbi.inference.command_line_tools:cl_npe_train_no_saving"
train_nle_model = "cryo_sbi.inference.command_line_tools:cl_nle_train_no_saving"
model_to_tensor = "cryo_sbi.utils.command_line_tools:cl_models_to_tensor"
pretrain_resnet18 = "cryo_sbi.utils.command_line_tools:cl_pretrain_resnet_18"
pretrain_spatial_cryo = "cryo_sbi.utils.command_line_tools:cl_pretrain_spatial_cryo_v3"
infer_populations = "cryo_sbi.utils.command_line_tools:cli_pinfer_populations"